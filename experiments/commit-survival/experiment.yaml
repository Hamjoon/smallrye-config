name: smallrye-config-commit-survival

project:
  repo: /Users/donggi/_projects/experiment-projects/smallrye-config
  language: java
  build: maven
  module: implementation          # artifact smallrye-config-core; built with -pl implementation -am (reactor Parent, Common, Core)
  test_framework: junit5

anchor: "3.6.0"                   # 838b091d, 2024-02-28
range:
  branch: origin/main             # fork main = upstream main HEAD 72d32378 (2026-11-06)
  end: 72d32378c615664ff72630c9ba203d16448cac21   # #586
  mode: first-parent
  limit: null
  skip_untouched: main-sources

scope:
  rule: explicit                  # change-ranked picked SmallRyeConfig + ConfigMappingContext: Dev (scope) 376 of 458 passing (most tests build a SmallRyeConfig)
  rank_by: change-count
  min_methods: 3
  exclude_accessor_heavy: true
  target_methods: [50, 80]
  max_dev_scope: 400
  max_classes: 10
  classes:                        # config mapping classes, all public: 41 methods, Dev (scope) 168 at t (Gary 2026-11-08)
    - io.smallrye.config.ConfigMappingInterface
    - io.smallrye.config.ConfigMappingLoader
    - io.smallrye.config.ConfigMappings
    - io.smallrye.config.ConfigMappingContext
  min_classes: 1

dev:
  discovery: build
  unmapped: exclude
  stable_runs: 1
  groups:
    - name: dev
      denominator: project
      frozen: false
    - name: dev-scope
      display: "Dev (scope)"
      denominator: coverage-scoped
      derive_from: dev

model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  env_key: OPENROUTER_API_KEY

generators:
  - name: ktester
    display: KTester
    method: ktester
    impl: author-tool
    tool_path: /Users/donggi/_projects/experiment-projects/KTester
    docker:
      compose_files:
        - /Users/donggi/_projects/experiment-projects/KTester/docker/compose.yml   # tool/ktester-runtime, no per-project override
      service: ktester
      mounts:
        /Users/donggi/_projects/experiment-projects/smallrye-config: /repo
        /Users/donggi/_projects/experiment-projects/KTester: /work
    params: {fix_tries: 3, temperature: 0.5, workers: 8}
    rounds: {max: 1}

  - name: ouedraogo
    display: Ouédraogo
    method: ouedraogo
    impl: native
    params: {prompts: [ZSL, FSL, CoT, ToT, GToT], temperature: 0.7, max_tokens: 16384}
    rounds: {max: 2, until_dev_matched: false, stop_after_zero_compile: 2}
    context:
      dependency_signatures: {enabled: true, max_types: 15, max_lines: 400}
    prompt:
      api_constraint: true
    postprocess:
      import_repair: {enabled: true, passes: 2}

screen:
  stable_runs: 1
  dedup: exact-body
  matching: none

survival:
  execution: batch
  selection: affected
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns: ["java.net.BindException"]
    max_reruns: 3
    backoff_seconds: 5

coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering

runner:
  docker:
    image: survival-java:17       # t, 3.11.2, 3.16.0 and HEAD compile on JDK 17
    mounts:
      /Users/donggi/_projects/experiment-projects/smallrye-config: /repo
    env_file: /Users/donggi/_projects/experiment-projects/KTester/docker/.env
  javac_mode: reused-jvm          # active only on a JDK 25 runner; falls back to one javac per compile on JDK 17
  reuse:
    checkouts: null
    classpath_cache: null
  workers: {build: 6, survive: 6, cover: 6}   # GCP survival-vm n2d-standard-16 (8 physical cores, 64 GB)
  timeouts: {build: 600, compile: 300, test_class: 120}
  jvm: {launcher: 1g, javac: 512m, jacoco: 1g}
  cache: {classpath: pom-sha256, node_modules: lockfile-sha256}
